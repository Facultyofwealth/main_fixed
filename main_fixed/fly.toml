# fly.toml app configuration file generated for inthebeginning on 2026-08-21T17:55:15+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inthebeginning'
primary_region = 'ord'

[build]
[http_service]
[[mounts]]
  source = "itb_data"
  destination = "/data"
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
